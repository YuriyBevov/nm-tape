<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Рафа — продажа упаковочных материалов{% endblock %}</title>
  <meta name="description" content="{% block description %}Производство и продажа клейкой ленты и упаковочных материалов.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% include "topline.html" %}
  {% include "header.html" %}
  <div class="page">
      {% block breadcrumbs %}{% endblock %}
      {% block content %}{% endblock %}
  </div>
  {% include "footer.html" %}
  <button class="to-top" id="toTop">↑</button>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
